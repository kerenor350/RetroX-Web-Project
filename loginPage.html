<!DOCTYPE html>
<html lang="en">
<style>
.bg {
    background-image: url('images/coverRetro.png');
    background-size: cover;
    background-position: center;
    min-height: 100vh;
    width: 100%;
    
    display: flex;
    justify-content: center; /* ממרכז אופקית */
    
    /* שינוי כאן: הצמדה לתחתית במקום למרכז */
    align-items: flex-end; 
    
    /* מרווח מהקצה התחתון של המסך */
    padding-bottom: 80px; 
}

.login-container {
    width: 200px; /* הקטנת הרוחב */
    
    /* חשוב מאוד: גובה אוטומטי כדי שהריבוע יתאים לתוכן */
    height: auto; 
    
    /* הקטנת המרווח הפנימי כדי שהריבוע לא ייראה ענק */
    padding: 10px; 
    
    background-color: rgba(197, 175, 140, 0.85); 
    border-radius: 8px; 
    color: rgb(0, 0, 0); 
    box-shadow: 0 15px 25px rgba(0,0,0,0.6); 
    
    /* ביטול ה-margin-top הישן */
    margin-top: 0; 
}
</style>


<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Streaming</title>
    <link rel="stylesheet" href="loginPage.css">
</head>

<body>

<div class="bg"> 
    <div class="login-container">
        <h2 style="margin-bottom: 20px;">Login</h2>
        <form style="display: flex; flex-direction: column; gap: 15px;">
            <input type="text" placeholder="Username" required style="padding: 10px; border-radius: 5px; border: none;">
            <input type="password" placeholder="Password" required style="padding: 10px; border-radius: 5px; border: none;">
            <button type="submit" style="padding: 10px; background-color: rgb(92, 81, 63); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                Login
            </button>
        </form>
        <div style="margin-top: 20px; font-size: 0.9rem;">
            <a href="createAnAccount.html" style="color: #000000; text-decoration: none;">Don't have an account? Sign up</a>
        </div>
    </div>
</div>
</body>


</html>
