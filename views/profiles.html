<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Profiles</title>

    <link
        rel="stylesheet"
        href="/css/variables.css">

    <link
        rel="stylesheet"
        href="/css/mainPage.css">

    <link
        rel="stylesheet"
        href="/css/profiles.css">

    <link
        rel="stylesheet"
        href="/css/fonts.css">

    <link
        rel="stylesheet"
        href="/css/layout.css">

</head>

<body>

    <!-- ===========================
            NAVBAR
    ============================ -->

    <nav class="navbar">

        <div class="left">

            <img
                src="/assets/logo.png"
                class="logo-img"
                alt="Retro Logo"
                onclick="window.location.href='/'"
            />

        </div>

        <div class="right">

            <button id="logoutBtn">

                Logout

            </button>

        </div>

    </nav>

    <!-- ===========================
            PROFILES
    ============================ -->

    <header class="profiles-header">

        <h1>Who's Watching?</h1>

    </header>

    <section class="container">

        <div class="profiles">

            <!-- Profiles load dynamically -->

        </div>

        <!-- ===========================
                ADD PERSONA
        ============================ -->

        <div class="add-persona">

            <input

                type="text"

                id="personaName"

                placeholder="New persona name"

            >

            <button id="addPersonaBtn">

                Add Persona

            </button>

        </div>

    </section>

    <footer class="site-footer">

        <p class="footer-brand">RetroX</p>

        <p>Web Development Project — HTML5 · CSS3 · JavaScript · MongoDB</p>

        <p>&copy; 2026 Anna Sasporta &amp; Keren Or Lebovitch</p>

    </footer>

    <script src="/js/profiles.js"></script>

</body>

</html>
