<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Retro Streaming</title>

    <link
        rel="stylesheet"
        href="/css/loginPage.css">

    <link
        rel="stylesheet"
        href="/css/fonts.css">

    <link
        rel="stylesheet"
        href="/css/layout.css">

</head>

<body>

<div class="bg">

<div class="login-container">

    <!-- ===========================
            LOGIN
    ============================ -->

    <div id="loginBox">

        <h2>Sign In</h2>

        <form id="login-form">

            <input
                id="username"
                type="text"
                placeholder="Username">

            <input
                id="password"
                type="password"
                placeholder="Password">

            <p id="login-message"></p>

            <button type="submit">

                Login

            </button>

        </form>

        <p class="switch-text">

            Don't have an account?

        </p>

        <button

            class="switch-btn"

            onclick="showRegister()">

            Create Account

        </button>

    </div>

    <!-- ===========================
            REGISTER
    ============================ -->

    <div

        id="registerBox"

        style="display:none;">

        <h2>Create Account</h2>

        <form id="register-form">

            <input

                id="registerUsername"

                type="text"

                placeholder="Username">

            <input

                id="registerPassword"

                type="password"

                placeholder="Password">

            <input

                id="registerPassword2"

                type="password"

                placeholder="Confirm Password">

            <p id="register-message"></p>

            <button type="submit">

                Register

            </button>

        </form>

        <p class="switch-text">

            Already have an account?

        </p>

        <button

            class="switch-btn"

            onclick="showLogin()">

            Sign In

        </button>

    </div>

</div>

</div>

<footer class="site-footer login-footer">

    <p class="footer-brand">RetroX</p>

    <p>Web Development Project — HTML5 · CSS3 · JavaScript · MongoDB</p>

    <p>&copy; 2026 Anna Sasporta &amp; Keren Or Lebovitch</p>

</footer>

<script src="/js/loginPage.js"></script>

</body>



</html>
